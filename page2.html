
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Lana 💌</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #e7f0c5;
  font-family: Georgia, serif;
  color: #315b36;
  text-align: center;
  padding: 20px;
}
.card {
  background: #fff5b9;
  padding: 35px 25px;
  border-radius: 25px;
  width: min(100%, 450px);
  box-shadow: 0 12px 35px #587a3740;
}
h1 { font-size: 35px; }
p { font-size: 19px; line-height: 1.9; }
a {
  display: inline-block;
  background: #497b48;
  color: white;
  padding: 13px 25px;
  border-radius: 30px;
  text-decoration: none;
  margin-top: 15px;
}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:50px">💌</div>
  <h1>Dear Lana...</h1>
  <p>
    I don't know how to explain how special you are to me.
    You make my days brighter just by being yourself.
  </p>
  <p>
    I hope you always remember that you are loved,
    appreciated, and truly special. 💛
  </p>
  <p>With love, always. 🌷</p>
  <a href="index.html">Back to the beginning ☀️</a>
</div>
</body>
</html>
